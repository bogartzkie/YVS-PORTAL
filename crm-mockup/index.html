<meta charset="utf-8">
<title>Prestige Recruitment CRM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Jost:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed ink sidebar + working canvas; sidebar collapses to a scrolling top tab strip on phones */
:root{
  --ink:#1b1f3a; --ink-2:#272c52; --ink-fg:#d9dcf0; --ink-mute:#8f94bd;
  --bg:#f4f5f9; --surface:#ffffff; --surface-2:#eef0f6; --line:#dcdfeb;
  --fg:#1c1f33; --mute:#626782;
  --brass:#a77a1c; --brass-soft:#f6ecd6; --brass-fg:#6e4f0d;
  --info:#2b62c9; --info-soft:#e3ecfb;
  --good:#1d7a4f; --good-soft:#ddf2e6;
  --warn:#a8630b; --warn-soft:#fbeedb;
  --bad:#b63a3a; --bad-soft:#f9e1e1;
  --shadow:0 10px 30px rgba(27,31,58,.18);
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ink:#0f1124; --ink-2:#1d2142; --ink-fg:#d9dcf0; --ink-mute:#8389b3;
  --bg:#14162a; --surface:#1c1f37; --surface-2:#252944; --line:#323758;
  --fg:#e6e8f4; --mute:#9a9fbf;
  --brass:#d9a845; --brass-soft:#3a3018; --brass-fg:#f0cf86;
  --info:#7aa5f5; --info-soft:#1f2c4d; --good:#5cc994; --good-soft:#173826;
  --warn:#eaa54c; --warn-soft:#3b2b14; --bad:#f08484; --bad-soft:#401f24;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --ink:#0f1124; --ink-2:#1d2142; --ink-fg:#d9dcf0; --ink-mute:#8389b3;
  --bg:#14162a; --surface:#1c1f37; --surface-2:#252944; --line:#323758;
  --fg:#e6e8f4; --mute:#9a9fbf;
  --brass:#d9a845; --brass-soft:#3a3018; --brass-fg:#f0cf86;
  --info:#7aa5f5; --info-soft:#1f2c4d; --good:#5cc994; --good-soft:#173826;
  --warn:#eaa54c; --warn-soft:#3b2b14; --bad:#f08484; --bad-soft:#401f24;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}

/* sidebar */
.side{background:var(--ink);color:var(--ink-fg);padding:20px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;padding-left:max(14px,env(safe-area-inset-left,0px))}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px}
.crest{width:34px;height:34px;border-radius:8px;background:var(--brass);color:var(--ink);display:grid;place-items:center;font:700 15px var(--f-display);flex:none}
.brand b{font:700 15px/1.15 var(--f-display);display:block;color:#fff}
.brand small{color:var(--ink-mute);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-mute);padding:10px 10px 4px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;color:var(--ink-fg);font-weight:500}
.nav button:hover{background:var(--ink-2)}
.nav button[aria-current="page"]{background:var(--ink-2);color:#fff;box-shadow:inset 3px 0 0 var(--brass)}
.nav button:focus-visible{outline:2px solid var(--brass)}
.nav .count{margin-left:auto;font:500 11px var(--f-mono);color:var(--ink-mute)}
.nav svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8}
.me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:10px;border-top:1px solid var(--ink-2)}
.me small{display:block;color:var(--ink-mute);font-size:11.5px}
.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:600 11.5px var(--f-body);background:var(--surface-2);color:var(--fg);flex:none}
.side .avatar{background:var(--brass-soft);color:var(--brass-fg)}

/* top bar */
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;padding-block:10px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.search{flex:1;max-width:460px;position:relative}
.search input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.search svg{position:absolute;left:10px;top:50%;translate:0 -50%;width:16px;height:16px;stroke:var(--mute);fill:none;stroke-width:2}
.icon-btn{all:unset;cursor:pointer;position:relative;width:36px;height:36px;display:grid;place-items:center;border-radius:8px;border:1px solid var(--line)}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:18px;height:18px;stroke:var(--fg);fill:none;stroke-width:1.8}
.dot{position:absolute;top:5px;right:5px;min-width:16px;height:16px;border-radius:8px;background:var(--bad);color:#fff;font:600 10px/16px var(--f-body);text-align:center;padding:0 4px}
.role-switch{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:12.5px;margin-left:auto}
.role-switch select{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.content{padding-block:24px 48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px;min-width:0}

/* type & generic */
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:26px;font-weight:700}
h2{font-size:17px;font-weight:700}
h3{font-size:14.5px;font-weight:700}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:600}
.muted{color:var(--mute)}
.mono{font-family:var(--f-mono);font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.page-head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.page-head p{margin:4px 0 0;color:var(--mute)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:7px;font-weight:500;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
:root[data-theme="dark"] .btn.primary{background:var(--brass);border-color:var(--brass);color:#1b1f3a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{background:var(--brass);border-color:var(--brass);color:#1b1f3a}}
.btn.brass{background:var(--brass);border-color:var(--brass);color:#fff}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.danger{color:var(--bad)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-b{padding:16px}
.grid{display:grid;gap:16px}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);align-items:start}
a{color:inherit;text-decoration-color:var(--brass);text-underline-offset:2px}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kpi{padding:14px 16px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0}
.kpi .v{font:700 26px/1.1 var(--f-display);font-variant-numeric:tabular-nums;margin-top:4px}
.kpi .d{font-size:12px;color:var(--mute)}
.kpi .d b{color:var(--good);font-weight:600}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--surface-2);color:var(--fg)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}
.t-info{background:var(--info-soft);color:var(--info)}
.t-good{background:var(--good-soft);color:var(--good)}
.t-warn{background:var(--warn-soft);color:var(--warn)}
.t-bad{background:var(--bad-soft);color:var(--bad)}
.t-accent{background:var(--brass-soft);color:var(--brass-fg)}
.t-neutral{background:var(--surface-2);color:var(--mute)}
.chip{display:inline-block;padding:2px 8px;border-radius:5px;background:var(--surface-2);font-size:12px;margin:0 4px 4px 0}
.flag{display:inline-flex;gap:4px;align-items:center;font-size:11.5px;font-weight:600;color:var(--warn);background:var(--warn-soft);padding:1px 7px;border-radius:4px}

/* tables */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
th.sortable{cursor:pointer}
th.sortable:hover{color:var(--fg)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
.who{display:flex;gap:10px;align-items:center;min-width:180px}
.who b{display:block;font-weight:600}
.who small{color:var(--mute);font-size:12px}
select.inline{border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:var(--surface);font-size:12.5px;max-width:180px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.toolbar input,.toolbar select{padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.toolbar input{min-width:0;flex:1 1 200px;max-width:280px}
.foot{display:flex;justify-content:space-between;padding:10px 16px;color:var(--mute);font-size:12.5px;border-top:1px solid var(--line);flex-wrap:wrap;gap:8px}

/* bars */
.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:150px minmax(0,1fr) 36px;gap:10px;align-items:center;font-size:13px}
.bar-row span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink-2);border-radius:5px}
:root[data-theme="dark"] .bar i{background:var(--info)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .bar i{background:var(--info)}}
.bar-row b{text-align:right;font-variant-numeric:tabular-nums}
.funnel{display:flex;flex-direction:column;gap:8px}
.f-step{display:grid;grid-template-columns:120px minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:13px}
.f-step .bar{height:24px;border-radius:5px}
.f-step .bar i{background:var(--brass);border-radius:5px;display:flex;align-items:center;padding-left:8px;color:#fff;font-size:12px;font-weight:600}
.f-step em{font-style:normal;color:var(--mute);text-align:right;font-size:12px}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:flex-start;padding:11px 16px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li small{color:var(--mute)}
.due{font:500 12px var(--f-mono);white-space:nowrap}
.due.over{color:var(--bad)}

/* pipeline */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:240px;gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--surface-2);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:240px}
.col.over{outline:2px dashed var(--brass);outline-offset:-2px}
.col-h{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 4px;font-weight:600;font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;cursor:grab;display:flex;flex-direction:column;gap:6px}
.card:hover{border-color:var(--brass)}
.card b{font-weight:600}
.card .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--mute)}

/* profile */
.profile-head{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.profile-head .avatar{width:56px;height:56px;font-size:18px;background:var(--brass-soft);color:var(--brass-fg)}
.kv{display:grid;grid-template-columns:140px minmax(0,1fr);gap:8px 14px;font-size:13.5px}
.kv dt{color:var(--mute)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 12px;overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:11px 10px;font-weight:500;color:var(--mute);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--brass)}
.tabs button:focus-visible{outline:2px solid var(--brass)}
.timeline{display:flex;flex-direction:column;gap:0;padding:6px 16px}
.tl{display:grid;grid-template-columns:14px minmax(0,1fr);gap:12px;padding:10px 0;position:relative}
.tl::before{content:"";position:absolute;left:6px;top:24px;bottom:-4px;width:1px;background:var(--line)}
.tl:last-child::before{display:none}
.tl i{width:13px;height:13px;border-radius:50%;border:2px solid var(--brass);background:var(--surface);margin-top:4px}
.tl small{color:var(--mute)}
.doc{display:flex;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:8px}
.doc .ext{font:600 10.5px var(--f-mono);padding:4px 6px;border-radius:4px;background:var(--bad-soft);color:var(--bad)}
.doc .ext.docx{background:var(--info-soft);color:var(--info)}
.doc .ext.jpg{background:var(--good-soft);color:var(--good)}
.drop{border:1.5px dashed var(--line);border-radius:8px;padding:14px;text-align:center;color:var(--mute);font-size:13px;cursor:pointer;display:block}
.drop:hover{border-color:var(--brass);color:var(--fg)}
.notice{display:flex;gap:10px;padding:10px 14px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-size:13px;align-items:flex-start}
.notice.info{background:var(--info-soft);color:var(--info)}
.notice.bad{background:var(--bad-soft);color:var(--bad)}
.notice.good{background:var(--good-soft);color:var(--good)}

/* client cards */
.client{display:flex;flex-direction:column;gap:10px;padding:16px;cursor:pointer}
.client:hover{border-color:var(--brass)}
.client .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--line);padding-top:10px}
.client .stats b{font:700 18px var(--f-display);display:block;font-variant-numeric:tabular-nums}
.client .stats small{color:var(--mute);font-size:11.5px}

/* modal, drawer, toast */
.scrim{position:fixed;inset:0;background:rgba(15,17,36,.5);z-index:40;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);width:min(640px,100%);max-height:calc(100% - 32px);overflow:auto;display:flex;flex-direction:column}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
.modal-b{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:12.5px;font-weight:600}
.field input,.field select,.field textarea{padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface);width:100%}
.field textarea{min-height:90px;resize:vertical}
.hint{font-size:12px;color:var(--mute)}
.field .hint{font-size:12px;color:var(--mute)}
.field.err input{border-color:var(--bad)}
.field.err .hint{color:var(--bad)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(380px,100%);background:var(--surface);box-shadow:var(--shadow);z-index:45;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));translate:-50% 0;background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;box-shadow:var(--shadow);z-index:60;font-size:13.5px;max-width:calc(100% - 32px)}
.mock-tag{font:500 10.5px var(--f-mono);letter-spacing:.06em;color:var(--brass-fg);background:var(--brass-soft);padding:2px 7px;border-radius:4px}
.perm td,.perm th{text-align:center}
.perm td:first-child,.perm th:first-child{text-align:left}
.yes{color:var(--good);font-weight:700}.no{color:var(--mute)}
.code{font:12px/1.6 var(--f-mono);background:var(--surface-2);border-radius:8px;padding:12px;overflow-x:auto;white-space:pre}

/* leads */
.thread{display:flex;flex-direction:column;gap:12px;padding:16px}
.msg{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px}
.msg .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--f-mono)}
.msg .body{background:var(--surface-2);border-radius:8px;padding:8px 12px;min-width:0;overflow-wrap:anywhere}
.msg.in .body{background:var(--good-soft)}
.msg .mhead{font-size:12.5px;margin-bottom:2px}
.composer{border-bottom:1px solid var(--line);padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.composer textarea{width:100%;min-height:64px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface);resize:vertical}
.composer .row{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.composer select{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.outcomes{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.outcomes .btn{justify-content:center}
.outcomes .btn[aria-pressed="true"]{background:var(--ink-2);border-color:var(--ink-2);color:#fff}
.bignum{font:600 24px/1.2 var(--f-mono);letter-spacing:.02em}
.qa{display:flex;gap:4px}
.snip{max-width:280px;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.unnamed{color:var(--mute);font-style:italic;font-weight:500}
.inline-edit{border:1px solid transparent;border-radius:6px;padding:3px 6px;background:transparent;width:100%;min-width:0}
.inline-edit:hover,.inline-edit:focus{border-color:var(--line);background:var(--surface)}
h1 .inline-edit{font:inherit;padding:0 6px;margin-left:-6px}

@media (max-width:1100px){.g-main,.g-3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;height:auto;flex-direction:row;align-items:center;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:12px;overflow-x:auto}
  .brand small,.nav-label,.me,.brand b{display:none}
  .nav{flex-direction:row}
  .nav button{white-space:nowrap}
  .nav .count{display:none}

  .form{grid-template-columns:minmax(0,1fr)}
  .kv{grid-template-columns:110px minmax(0,1fr)}
  .bar-row{grid-template-columns:110px minmax(0,1fr) 30px}

}

   <div class="table-wrap"><table><thead><tr><th>Number</th><th>Name</th><th>Company</th><th>Check</th></tr></thead><tbody>${rows.map(r=>`<tr><td class="mono">${r[0]}</td><td>${r[1]||'<span class="muted">none</span>'}</td><td>${r[2]||'<span class="muted">none</span>'}</td><td>${r[4]==='ok'?pill('Ready',{Ready:'good'}):r[4]==='fix'?'<span class="pill t-info">Country code added: +971 50 123 4567</span>':r[4]==='dup'?'<span class="flag">Already lead LD-1046</span>':'<span class="pill t-bad">Too short</span>'}</td></tr>`).join('')}</tbody></table></div>
   <div class="form"><div class="field"><label for="li-cc">Default country code for local numbers</label><select id="li-cc"><option>+971 UAE</option><option>+966 Saudi Arabia</option><option>+974 Qatar</option><option>+63 Philippines</option></select></div>
   <div class="field"><label for="li-assign">Assign leads to</label><select id="li-assign"><option>Split evenly between staff</option>${RECRUITERS.map(r=>`<option>${r}</option>`).join('')}<option>Leave unassigned</option></select></div>
   <div class="field full"><label for="li-dup">When a number already exists</label><select id="li-dup"><option>Skip it and add the remark as a comment on the existing lead</option><option>Skip it</option><option>Import anyway and flag</option></select></div></div>`,
   `<button class="btn" data-close>Cancel</button><button class="btn primary" data-act="do-import-leads">Import 1,229 leads</button>`);
  mImportLeads.rows=rows;
}
function doImportLeads(){
  let n=Math.max(...leads.map(l=>+l.id.slice(3)));
  mImportLeads.rows.filter(r=>['ok','fix'].includes(r[4])).forEach((r,i)=>{n++;const ph=r[4]==='fix'?'+971 50 123 4567':r[0];leads.unshift(L('LD-'+n,r[1],r[2],ph,'',{'+971':'UAE','+966':'Saudi Arabia','+968':'Oman'}[ph.slice(0,4)]||'UAE','Excel import','New lead',RECRUITERS[i%3],'',[...(r[3]?[[NOW(),'Imported remark','comment',r[3]]]:[]),[NOW(),'System','system','Imported from Leads master sheet.xlsx'+(r[1]?'':'. Number only.')]]))});
  closeModal();toast('Imported 1,229 leads, split between 3 staff. Skipped 41 duplicates and 14 invalid numbers.');go('leads');
}
function mAddLead(){
  modal('Add client lead',`<div class="form"><div class="field" id="w-lp"><label for="nl-phone">Phone number *</label><input id="nl-phone" value="+971 58 902 3341"><span class="hint">Only the number is required</span></div>
   <div class="field"><label for="nl-name">Contact name</label><input id="nl-name"></div><div class="field"><label for="nl-company">Company</label><input id="nl-company"></div>
   <div class="field"><label for="nl-country">Country</label><select id="nl-country">${opts(['UAE','Saudi Arabia','Qatar','Oman','Kuwait','Bahrain','Singapore'],'UAE')}</select></div>
   <div class="field"><label for="nl-src">Source</label><select id="nl-src">${opts(LEAD_SOURCES,'Manual entry')}</select></div><div class="field"><label for="nl-owner">Assign to</label><select id="nl-owner">${opts(RECRUITERS,'Maria Santos')}</select></div>
   <div class="field full"><label for="nl-note">First comment</label><textarea id="nl-note" style="min-height:60px"></textarea></div></div>`,
   `<button class="btn" data-close>Cancel</button><button class="btn primary" data-act="save-lead">Save lead</button>`);
  const chk=()=>{const d=leads.find(l=>normPhone(l.phone)===normPhone($('#nl-phone').value));$('#w-lp').classList.toggle('err',!!d);$('#w-lp .hint').textContent=d?`Already saved as ${d.id}`:'Only the number is required'};$('#nl-phone').oninput=chk;chk();
}
function saveLead(){
  const ph=$('#nl-phone').value.trim();if(normPhone(ph).length<8)return toast('Enter a full phone number with country code.');
  if(leads.find(l=>normPhone(l.phone)===normPhone(ph)))return toast('This number is already a lead.');
  const l=L('LD-'+(Math.max(...leads.map(l=>+l.id.slice(3)))+1),$('#nl-name').value.trim(),$('#nl-company').value.trim(),ph,'',$('#nl-country').value,$('#nl-src').value,'New lead',$('#nl-owner').value,'',[[NOW(),'Maria Santos','system','Lead added manually.']]);
  if($('#nl-note').value.trim())addEntry(l,'comment',$('#nl-note').value.trim());
  leads.unshift(l);closeModal();toast(`${l.id} saved.`);go('lead',{lead:l.id});
}
function convertLead(){
  const l=leadById(state.lead);if(!l.company)return toast('Add the company name before converting.');
  const vac=l.needs.split('\n').map(x=>x.match(/^(.+?)\s*[x×]\s*(\d+)/i)).filter(Boolean).map(m=>[m[1].trim(),+m[2]]);
  const c={id:'CL-0'+(Math.max(...clients.map(c=>+c.id.slice(-2)))+1),name:l.company,industry:'To confirm',city:l.country,contact:l.name||'To confirm',email:l.email,phone:l.phone,archived:false,vacancies:vac};
  clients.unshift(c);C_DOCS[c.id]=[...l.docs];l.client=c.id;l.status='Converted to client';addEntry(l,'system',`Converted to client ${c.id}. ${vac.length} vacancies copied from needs.`,'System');
  toast(`${c.name} is now a client.`);go('client',{client:c.id});
}

/* ---------- render & events ---------- */
const VIEWS={leads:vLeads,lead:vLead,dashboard:vDashboard,applicants:vApplicants,profile:vProfile,pipeline:vPipeline,clients:vClients,client:vClient,submissions:vSubmissions,email:vEmail,reports:vReports,settings:vSettings};
function render(){renderNav();const html=VIEWS[state.view]();if(html)$('#view').innerHTML=html;bindView()}
function bindView(){
  const on=(s,ev,fn)=>{const e=$(s);if(e)e[ev]=fn};
  on('#range','onchange',e=>{state.range=+e.target.value;render()});
  [['#f-status','status'],['#f-pos','pos'],['#f-source','source'],['#f-rec','rec']].forEach(([s,k])=>on(s,'onchange',e=>{state.filters[k]=e.target.value;render()}));
  on('#f-q','oninput',e=>{state.filters.q=e.target.value;const pos=e.target.selectionStart;render();const i=$('#f-q');i.focus();i.setSelectionRange(pos,pos)});
  [['#lf-status','status'],['#lf-owner','owner'],['#lf-source','source']].forEach(([s,k])=>on(s,'onchange',e=>{state.lf[k]=e.target.value;render()}));
  on('#lf-unnamed','onchange',e=>{state.lf.unnamed=e.target.checked;render()});
  on('#lf-q','oninput',e=>{state.lf.q=e.target.value;const pos=e.target.selectionStart;render();const i=$('#lf-q');i.focus();i.setSelectionRange(pos,pos)});
  const lf=(id,key,label)=>on(id,'onchange',e=>{const l=leadById(state.lead);const v=e.target.value.trim();if(v===l[key])return;addEntry(l,'system',`${label} changed${l[key]?' from '+l[key]:''} to ${v||'(blank)'}`);l[key]=v;toast(label+' saved.');render()});
  lf('#l-name','name','Contact name');lf('#l-company','company','Company');lf('#l-email','email','Email');lf('#l-owner','owner','Assigned staff');lf('#l-next','next','Next follow-up');lf('#l-status','status','Status');
  on('#pipe-rec','onchange',e=>{state.filters.rec=e.target.value;render()});
  on('#s-status','onchange',e=>{state.subFilter.status=e.target.value;render()});
  on('#s-client','onchange',e=>{state.subFilter.client=e.target.value;render()});
  on('#show-arch','onchange',e=>{state.showArchived=e.target.checked;render()});
  on('#p-status','onchange',e=>{const a=appById(state.app);log(a.id,`Status changed: ${a.status} to ${e.target.value}`);a.status=e.target.value;toast('Overall status updated.');render()});
  on('#p-rec','onchange',e=>{const a=appById(state.app);log(a.id,`Reassigned: ${a.rec} to ${e.target.value}`);a.rec=e.target.value;toast('Recruiter reassigned.')});
  document.querySelectorAll('[data-col]').forEach(col=>{
    col.ondragover=e=>{e.preventDefault();col.classList.add('over')};col.ondragleave=()=>col.classList.remove('over');
    col.ondrop=e=>{e.preventDefault();const a=appById(e.dataTransfer.getData('text'));if(a&&a.status!==col.dataset.col){log(a.id,`Status changed: ${a.status} to ${col.dataset.col}`);a.status=col.dataset.col;toast(`${a.name} moved to ${a.status}.`)}render()};});
  document.querySelectorAll('[data-card]').forEach(c=>c.ondragstart=e=>e.dataTransfer.setData('text',c.dataset.card));
}
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.status){const a=appById(t.dataset.status);log(a.id,`Status changed: ${a.status} to ${t.value}`);a.status=t.value;toast(`${a.name}: ${t.value}`)}
  if(t.dataset.lstatus){const l=leadById(t.dataset.lstatus);addEntry(l,'system',`Status changed: ${l.status} to ${t.value}`);l.status=t.value;toast(`${l.id}: ${t.value}`)}
  if(t.dataset.sub){const s=subs.find(x=>x.id===t.dataset.sub);log(s.app,`${clientById(s.client).name} submission: ${s.status} to ${t.value}`);s.status=t.value;toast(`Client status updated to ${t.value}. Overall status unchanged.`)}
});
document.addEventListener('click',e=>{
  if(e.target.closest('select,input,textarea,label')&&!e.target.closest('[data-act]'))return;
  const t=e.target.closest('[data-nav],[data-lead],[data-open],[data-client],[data-act],[data-tab],[data-sort],[data-close]');
  if(!t)return;
  if(t.hasAttribute('data-close')){if(e.target===t||t.tagName==='BUTTON')closeModal();return}
  e.preventDefault();
  if(t.dataset.nav)return go(t.dataset.nav);
  if(t.dataset.lead){closeModal();return go('lead',{lead:t.dataset.lead})}
  if(t.dataset.open){closeModal();return go('profile',{app:t.dataset.open,tab:'overview'})}
  if(t.dataset.client)return go('client',{client:t.dataset.client});
  if(t.dataset.tab){state.tab=t.dataset.tab;return render()}
  if(t.dataset.sort){state.sort=[t.dataset.sort,state.sort[0]===t.dataset.sort?-state.sort[1]:1];return render()}
  const act=t.dataset.act;
  ({upload:()=>mUpload(t.dataset.kind,t.dataset.uid),'do-upload':doUpload,'add-status':()=>toast('New status added to the list (mockup).'),
    'import-leads':mImportLeads,'do-import-leads':doImportLeads,'add-lead':mAddLead,'save-lead':saveLead,queue:startQueue,
    call:()=>mCall(t.dataset.lid),wa:()=>mWa(t.dataset.lid),'lead-mail':()=>mLeadMail(t.dataset.lid),'send-wa':sendWa,'send-lead-mail':sendLeadMail,
    outcome:()=>document.querySelectorAll('[data-act="outcome"]').forEach(b=>b.setAttribute('aria-pressed',b===t)),'save-call':saveCall,skip:nextInQueue,convert:convertLead,
    copy:()=>{try{navigator.clipboard.writeText(t.dataset.copy).then(()=>toast('Number copied.'),()=>toast('Copy blocked. Select the number instead.'))}catch(_){toast('Copy blocked. Select the number instead.')}},
    post:()=>{const l=leadById(state.lead),x=$('#cm-text').value.trim();if(!x)return toast('Write a comment first.');addEntry(l,$('#cm-kind').value,x);toast('Comment posted.');render()},
    'save-needs':()=>{const l=leadById(state.lead);l.needs=$('#l-needs').value;l.headcount=$('#l-head').value;if(l.needs&&['New lead','Contacted','Hot lead','WhatsApp only','Call back later'].includes(l.status))l.status='Needs received';addEntry(l,'comment','Needs updated:\n'+l.needs);toast('Needs saved.');render()},
    'add-pick':()=>{const l=leadById(state.lead),id=$('#pick-sel').value;if(!id)return;l.picks.push(id);addEntry(l,'comment',`Client picked ${appById(id).name} (${id}).`);toast('Candidate added to client picks.');render()},
    'rm-pick':()=>{const l=leadById(state.lead);l.picks=l.picks.filter(x=>x!==t.dataset.pick);addEntry(l,'comment',`Removed ${appById(t.dataset.pick).name} from client picks.`);render()},
    add:mAdd,'save-add':saveAdd,import:mImport,'do-import':doImport,submit:()=>mSubmit(t.dataset.app||state.app),'do-submit':doSubmit,
    compose:()=>mCompose({app:t.dataset.to,client:t.dataset.clientTo,tpl:t.dataset.tpl}),send,'add-client':mClient,'save-client':saveClient,
    clear:()=>{state.filters={q:'',status:'',pos:'',source:'',rec:''};render()},
    export:()=>toast('Export prepared: recruitment_report_2026-10-23.csv (mockup)'),
    'save-notes':()=>{const a=appById(state.app);a.notes=$('#p-notes').value;log(a.id,'Internal notes edited');toast('Notes saved.')},
    merge:()=>{const d=t.dataset.dup;const a=appById(state.app);applicants=applicants.filter(x=>x.id!==d);log(a.id,`Merged ${d} into this record`);toast(`${d} merged into ${a.id}.`);render()},
    notdup:()=>toast('Marked as not a duplicate.'),
    'archive-client':()=>{const c=clientById(state.client);c.archived=!c.archived;toast(c.archived?`${c.name} archived. History is kept.`:`${c.name} restored.`);render()},
    retry:()=>{$('#failed-row').innerHTML='<td class="num">22 Oct 09:15</td><td>Ahmed Siddiqui</td><td><span class="pill t-good">Recovered</span></td><td></td>';toast('Submission recovered and applicant created.')},
    perm:()=>{const on=t.classList.toggle('yes');t.classList.toggle('no',!on);t.textContent=on?'✓':'–';toast('Permission updated.')},
  }[act]||(()=>toast('This action is part of the full build.')))();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Enter'&&e.target.matches('.client'))go('client',{client:e.target.dataset.client})});
$('#bell').onclick=drawer;
$('#role').onchange=e=>{$('#me-role').textContent=e.target.value;if(e.target.value!=='Administrator'&&state.view==='settings')state.view='dashboard';toast(`Viewing as ${e.target.value}. ${e.target.value==='Recruiter'?'Settings hidden; reports limited.':e.target.value==='Manager'?'Read-only pipeline and reports.':''}`);render()};
$('#global-search').onkeydown=e=>{if(e.key==='Enter'){state.filters.q=e.target.value;go('applicants')}};
render();
</script>
